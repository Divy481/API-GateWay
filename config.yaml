server:
  address: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 120s
  max_header_bytes: 8192
  max_idle_conns: 1000
  max_idle_conns_per_host: 100
  idle_conn_timeout: 90s
  response_header_timeout: 5s
  dial_timeout: 5s

routes:
  - id: "user_service"
    path: "/api/users"
    upstreams:
      - "http://localhost:8081"
      - "http://localhost:8082"
  - id: "order_service"
    path: "/api/orders"
    upstreams:
      - "http://localhost:8083"
